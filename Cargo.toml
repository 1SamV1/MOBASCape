[workspace]
resolver = "2"
members = ["crates/cache", "crates/tools", "crates/sim", "crates/ui", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
flate2 = "1.0"
bzip2 = "0.5"
lzma-rs = "0.3"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# A build for trying changes quickly: `cargo run -p rift-client --profile quick`.
# Optimised like a release, but without the whole-program pass at the end that
# makes a release build take minutes after every change. The game runs a
# little slower than a release and behaves the same.
[profile.quick]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
